
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .clock-container {
            text-align: center;
            background: #1f2937;
            padding: 35px;
            border-radius: 15px;
            width: min(85%, 500px);
        }

        #clock {
            font-size: clamp(32px, 8vw, 55px);
            color: #67e8f9;
            font-weight: bold;
            margin: 20px 0;
        }

        #date {
            color: #d1d5db;
        }
    </style>
</head>

<body>
    <div class="clock-container">
        <h1>Digital Clock</h1>
        <div id="clock">00:00:00</div>
        <div id="date"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const time = now.toLocaleTimeString("en-IN", {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: true
            });

            const date = now.toLocaleDateString("en-IN", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            document.getElementById("clock").textContent = time;
            document.getElementById("date").textContent = date;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
